[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvibrant-gui"
version = "1.0.0"
description = "GTK4/Adwaita GUI for controlling NVIDIA Digital Vibrance per display output"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "quan"}
]
keywords = ["nvidia", "vibrance", "wayland", "gtk4", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: System :: Hardware",
]
dependencies = [
    "PyGObject>=3.42",
]

[project.scripts]
nvibrant-gui = "nvibrant_gui.__main__:main"

[project.urls]
Homepage = "https://github.com/Tremeschin/nvibrant"
Repository = "https://github.com/Tremeschin/nvibrant"

[tool.setuptools.packages.find]
include = ["nvibrant_gui*"]

[tool.setuptools.package-data]
"nvibrant_gui.data" = ["*.desktop"]
